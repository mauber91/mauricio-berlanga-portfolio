<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Design QA overview comparison</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1440px; min-width: 1440px; height: 512px; margin: 0; overflow: hidden; background: #111; }
      main { display: grid; grid-template-columns: 720px 720px; width: 1440px; height: 512px; }
      img { display: block; width: 720px; height: 512px; object-fit: fill; }
    </style>
  </head>
  <body>
    <main aria-label="Full source design on the left and full implementation on the right">
      <img src="./source-normalized.png" alt="Source design overview" />
      <img src="./implementation-normalized.png" alt="Implementation overview" />
    </main>
  </body>
</html>
